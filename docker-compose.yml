version: "3.8"

services:
  node:
    build: .
    image: car_shop_api:latest
    container_name: car_shop
    restart: always
    ports:
      - 3001:3001
    environment:
      - PORT=${PORT:-3001}
      - MONGO_URI=${MONGO_URI:-mongodb://mongodb:27017/CarShop}
      - REDIS_HOST=${REDIS_HOST:-redis}
      - REDIS_PORT=${REDIS_PORT:-6379}
      - JWT_SECRET=${JWT_SECRET:-car_shop_secret_jwt_key_portfolio}
    depends_on:
      - mongodb
      - redis
    volumes:
      - ./:/app
      - /app/node_modules

  mongodb:
    image: mongo:6.0
    container_name: car_shop_db
    restart: always
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:alpine
    container_name: car_shop_redis
    restart: always
    ports:
      - 6379:6379
    volumes:
      - redis_data:/data

volumes:
  mongo_data:
  redis_data:

networks:
  default:
    name: car_shop_net
